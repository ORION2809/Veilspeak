<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="barAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="barRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <rect width="860" height="520" rx="12" fill="url(#bg4)" stroke="#e2e8f0" stroke-width="1"/>

  <text x="430" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a" letter-spacing="0.5">SPEECH DELIVERY ACROSS NETWORK SCENARIOS</text>
  <text x="430" y="48" text-anchor="middle" font-size="11" fill="#64748b">168 simulated calls (6 per scenario, 45 s each) &mdash; share of speech frames delivered correctly</text>

  <!-- Chart area -->
  <!-- Y-axis labels (scenario names), X-axis is percentage 0-100% -->
  <!-- Bar width = percentage * 4.0 (max 400px for 100%) -->

  <!-- Grid lines -->
  <line x1="350" y1="65" x2="350" y2="490" stroke="#e2e8f0" stroke-width="0.5"/>
  <line x1="450" y1="65" x2="450" y2="490" stroke="#e2e8f0" stroke-width="0.5"/>
  <line x1="550" y1="65" x2="550" y2="490" stroke="#e2e8f0" stroke-width="0.5"/>
  <line x1="650" y1="65" x2="650" y2="490" stroke="#e2e8f0" stroke-width="0.5"/>
  <line x1="750" y1="65" x2="750" y2="490" stroke="#e2e8f0" stroke-width="0.5"/>

  <!-- X-axis labels -->
  <text x="350" y="505" text-anchor="middle" font-size="9" fill="#94a3b8">0%</text>
  <text x="450" y="505" text-anchor="middle" font-size="9" fill="#94a3b8">25%</text>
  <text x="550" y="505" text-anchor="middle" font-size="9" fill="#94a3b8">50%</text>
  <text x="650" y="505" text-anchor="middle" font-size="9" fill="#94a3b8">75%</text>
  <text x="750" y="505" text-anchor="middle" font-size="9" fill="#94a3b8">100%</text>

  <!-- Bars with labels -->
  <!-- Row height: 25px, start at y=72 -->

  <!-- 2G full rate -->
  <text x="345" y="82" text-anchor="end" font-size="9" fill="#334155">2G full rate, good signal</text>
  <rect x="350" y="72" width="400" height="16" rx="3" fill="url(#barGreen)"/>
  <text x="755" y="83" font-size="9" fill="#059669" font-weight="600">100%</text>

  <!-- VoLTE AMR-WB 23.85 -->
  <text x="345" y="107" text-anchor="end" font-size="9" fill="#334155">VoLTE AMR-WB 23.85</text>
  <rect x="350" y="97" width="400" height="16" rx="3" fill="url(#barGreen)"/>
  <text x="755" y="108" font-size="9" fill="#059669" font-weight="600">100%</text>

  <!-- VoLTE AMR-WB 8.85 -->
  <text x="345" y="132" text-anchor="end" font-size="9" fill="#334155">VoLTE AMR-WB 8.85</text>
  <rect x="350" y="122" width="400" height="16" rx="3" fill="url(#barGreen)"/>
  <text x="755" y="133" font-size="9" fill="#059669" font-weight="600">100%</text>

  <!-- VoLTE EVS 9.6 -->
  <text x="345" y="157" text-anchor="end" font-size="9" fill="#334155">VoLTE EVS 9.6</text>
  <rect x="350" y="147" width="400" height="16" rx="3" fill="url(#barGreen)"/>
  <text x="755" y="158" font-size="9" fill="#059669" font-weight="600">100%</text>

  <!-- 2G-to-2G transcoded -->
  <text x="345" y="182" text-anchor="end" font-size="9" fill="#334155">2G-to-2G transcoded (full rate)</text>
  <rect x="350" y="172" width="400" height="16" rx="3" fill="url(#barGreen)"/>
  <text x="755" y="183" font-size="9" fill="#059669" font-weight="600">100%</text>

  <!-- VoLTE to 2G transcoded -->
  <text x="345" y="207" text-anchor="end" font-size="9" fill="#334155">VoLTE-to-2G transcoded</text>
  <rect x="350" y="197" width="400" height="16" rx="3" fill="url(#barGreen)"/>
  <text x="755" y="208" font-size="9" fill="#059669" font-weight="600">100%</text>

  <!-- Noise suppressor + gain control -->
  <text x="345" y="232" text-anchor="end" font-size="9" fill="#334155">2G + noise suppressor 12 dB</text>
  <rect x="350" y="222" width="400" height="16" rx="3" fill="url(#barGreen)"/>
  <text x="755" y="233" font-size="9" fill="#059669" font-weight="600">100%</text>

  <!-- VoLTE AMR-WB 12.65, 0.5% loss -->
  <text x="345" y="257" text-anchor="end" font-size="9" fill="#334155">VoLTE AMR-WB 12.65, 0.5% loss</text>
  <rect x="350" y="247" width="399.6" height="16" rx="3" fill="url(#barGreen)"/>
  <text x="755" y="258" font-size="9" fill="#059669" font-weight="600">99.9%</text>

  <!-- EVS 13.2 jitter 1% loss -->
  <text x="345" y="282" text-anchor="end" font-size="9" fill="#334155">VoLTE EVS 13.2, jitter, 1% loss</text>
  <rect x="350" y="272" width="399.6" height="16" rx="3" fill="url(#barGreen)"/>
  <text x="755" y="283" font-size="9" fill="#059669" font-weight="600">99.9%</text>

  <!-- 2G fading 3% loss -->
  <text x="345" y="307" text-anchor="end" font-size="9" fill="#334155">2G full rate, fading (3% loss)</text>
  <rect x="350" y="297" width="396" height="16" rx="3" fill="url(#barGreen)"/>
  <text x="751" y="308" font-size="9" fill="#059669" font-weight="600">99.0%</text>

  <!-- 2G-to-2G half rate -->
  <text x="345" y="332" text-anchor="end" font-size="9" fill="#334155">2G-to-2G transcoded (half rate)</text>
  <rect x="350" y="322" width="394.4" height="16" rx="3" fill="url(#barGreen)"/>
  <text x="749" y="333" font-size="9" fill="#059669" font-weight="600">98.6%</text>

  <!-- VoLTE handover to 2G -->
  <text x="345" y="357" text-anchor="end" font-size="9" fill="#334155">VoLTE handed over to 2G</text>
  <rect x="350" y="347" width="392" height="16" rx="3" fill="url(#barGreen)"/>
  <text x="747" y="358" font-size="9" fill="#059669" font-weight="600">98.0%</text>

  <!-- EVS heavy jitter -->
  <text x="345" y="382" text-anchor="end" font-size="9" fill="#334155">EVS 13.2, heavy jitter, 2% loss</text>
  <rect x="350" y="372" width="390.8" height="16" rx="3" fill="url(#barAmber)"/>
  <text x="746" y="383" font-size="9" fill="#b45309" font-weight="600">97.7%</text>

  <!-- 2G rate drop + handover -->
  <text x="345" y="407" text-anchor="end" font-size="9" fill="#334155">2G rate drop + handover</text>
  <rect x="350" y="397" width="387.2" height="16" rx="3" fill="url(#barAmber)"/>
  <text x="742" y="408" font-size="9" fill="#b45309" font-weight="600">96.8%</text>

  <!-- 2G deep fade -->
  <text x="345" y="432" text-anchor="end" font-size="9" fill="#334155">2G deep fade (4.75 kbps for 7 s)</text>
  <rect x="350" y="422" width="313.6" height="16" rx="3" fill="url(#barRed)"/>
  <text x="668" y="433" font-size="9" fill="#dc2626" font-weight="600">78.4%</text>

  <!-- 18 dB noise suppressor -->
  <text x="345" y="457" text-anchor="end" font-size="9" fill="#334155">18 dB noise suppressor (both)</text>
  <rect x="350" y="447" width="305.6" height="16" rx="3" fill="url(#barRed)"/>
  <text x="660" y="458" font-size="9" fill="#dc2626" font-weight="600">76.4%</text>

  <!-- 2G cell edge -->
  <text x="345" y="482" text-anchor="end" font-size="9" fill="#334155">2G cell edge (down to 4.75 kbps)</text>
  <rect x="350" y="472" width="225.6" height="16" rx="3" fill="url(#barRed)"/>
  <text x="580" y="483" font-size="9" fill="#dc2626" font-weight="600">56.4%</text>

  <!-- Legend -->
  <rect x="350" y="65" width="8" height="8" rx="2" fill="#10b981"/>
  <text x="362" y="73" font-size="8" fill="#64748b">97.7%+ delivery</text>
  <rect x="445" y="65" width="8" height="8" rx="2" fill="#f59e0b"/>
  <text x="457" y="73" font-size="8" fill="#64748b">96-97.7%</text>
  <rect x="520" y="65" width="8" height="8" rx="2" fill="#ef4444"/>
  <text x="532" y="73" font-size="8" fill="#64748b">Below 96% (extreme conditions)</text>
</svg>
