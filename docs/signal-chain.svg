<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arrow-r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#94a3b8"/>
    </marker>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="940" height="340" rx="12" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="470" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a" letter-spacing="0.5">SIGNAL PROCESSING PIPELINE</text>
  <text x="470" y="50" text-anchor="middle" font-size="11" fill="#64748b">Sender (top) &amp; Receiver (bottom)</text>

  <!-- === SENDER CHAIN (top) === -->
  <!-- Voice Input -->
  <rect x="20" y="75" width="100" height="56" rx="8" fill="#f97316" opacity="0.12" stroke="#f97316" stroke-width="1.5"/>
  <text x="70" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#c2410c">Voice</text>
  <text x="70" y="116" text-anchor="middle" font-size="9" fill="#9a3412">8 kHz PCM</text>

  <line x1="120" y1="103" x2="148" y2="103" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Codec2 -->
  <rect x="150" y="75" width="110" height="56" rx="8" fill="#8b5cf6" opacity="0.12" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="205" y="97" text-anchor="middle" font-size="12" font-weight="600" fill="#6d28d9">Codec2</text>
  <text x="205" y="112" text-anchor="middle" font-size="9" fill="#7c3aed">1200 or 700 bps</text>
  <text x="205" y="124" text-anchor="middle" font-size="8" fill="#a78bfa">speech frames</text>

  <line x1="260" y1="103" x2="288" y2="103" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- AES Encryption -->
  <rect x="290" y="75" width="130" height="56" rx="8" fill="#10b981" opacity="0.12" stroke="#10b981" stroke-width="1.5"/>
  <text x="355" y="97" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">AES-256-CTR</text>
  <text x="355" y="112" text-anchor="middle" font-size="9" fill="#059669">+ 16-bit HMAC tag</text>
  <text x="355" y="124" text-anchor="middle" font-size="8" fill="#34d399">encrypt-then-MAC</text>

  <line x1="420" y1="103" x2="448" y2="103" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Reed-Solomon -->
  <rect x="450" y="75" width="120" height="56" rx="8" fill="#3b82f6" opacity="0.12" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="510" y="97" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">Reed-Solomon</text>
  <text x="510" y="112" text-anchor="middle" font-size="9" fill="#2563eb">erasure coding</text>
  <text x="510" y="124" text-anchor="middle" font-size="8" fill="#60a5fa">FEC protection</text>

  <line x1="570" y1="103" x2="598" y2="103" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Modem -->
  <rect x="600" y="75" width="120" height="56" rx="8" fill="#06b6d4" opacity="0.12" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="660" y="97" text-anchor="middle" font-size="12" font-weight="600" fill="#0e7490">P2 Modem</text>
  <text x="660" y="112" text-anchor="middle" font-size="9" fill="#0891b2">23 tones, 4-PSK</text>
  <text x="660" y="124" text-anchor="middle" font-size="8" fill="#22d3ee">400-2600 Hz</text>

  <line x1="720" y1="103" x2="748" y2="103" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phone -->
  <rect x="750" y="75" width="170" height="56" rx="8" fill="#ef4444" opacity="0.1" stroke="#ef4444" stroke-width="1.5"/>
  <text x="835" y="97" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">Phone Network</text>
  <text x="835" y="112" text-anchor="middle" font-size="9" fill="#ef4444">AMR / AMR-WB / EVS</text>
  <text x="835" y="124" text-anchor="middle" font-size="8" fill="#f87171">lossy voice codec</text>

  <!-- Sender label -->
  <text x="470" y="70" text-anchor="middle" font-size="10" font-weight="600" fill="#475569" letter-spacing="2">SENDER</text>

  <!-- === PHONE CHANNEL (middle) === -->
  <rect x="750" y="148" width="170" height="44" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="835" y="166" text-anchor="middle" font-size="10" fill="#991b1b" font-weight="500">Ordinary Phone Call</text>
  <text x="835" y="180" text-anchor="middle" font-size="8" fill="#b91c1c">2G / 3G / VoLTE</text>
  <line x1="835" y1="131" x2="835" y2="148" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="835" y1="192" x2="835" y2="209" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,2"/>

  <!-- === RECEIVER CHAIN (bottom) === -->
  <!-- Receiver label -->
  <text x="470" y="222" text-anchor="middle" font-size="10" font-weight="600" fill="#475569" letter-spacing="2">RECEIVER</text>

  <!-- Phone (receive) -->
  <rect x="750" y="231" width="170" height="56" rx="8" fill="#ef4444" opacity="0.1" stroke="#ef4444" stroke-width="1.5"/>
  <text x="835" y="253" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">Phone Network</text>
  <text x="835" y="268" text-anchor="middle" font-size="9" fill="#ef4444">codec decode</text>
  <text x="835" y="280" text-anchor="middle" font-size="8" fill="#f87171">distorted signal</text>

  <line x1="748" y1="259" x2="720" y2="259" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-r)"/>

  <!-- Demodulator -->
  <rect x="600" y="231" width="120" height="56" rx="8" fill="#06b6d4" opacity="0.12" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="660" y="250" text-anchor="middle" font-size="11" font-weight="600" fill="#0e7490">Demodulator</text>
  <text x="660" y="265" text-anchor="middle" font-size="9" fill="#0891b2">phase recovery</text>
  <text x="660" y="277" text-anchor="middle" font-size="8" fill="#22d3ee">timing sync</text>

  <line x1="598" y1="259" x2="570" y2="259" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-r)"/>

  <!-- RS Decode -->
  <rect x="450" y="231" width="120" height="56" rx="8" fill="#3b82f6" opacity="0.12" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="510" y="250" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">RS Decode</text>
  <text x="510" y="265" text-anchor="middle" font-size="9" fill="#2563eb">error correction</text>
  <text x="510" y="277" text-anchor="middle" font-size="8" fill="#60a5fa">erasure recovery</text>

  <line x1="448" y1="259" x2="420" y2="259" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-r)"/>

  <!-- Decrypt -->
  <rect x="290" y="231" width="130" height="56" rx="8" fill="#10b981" opacity="0.12" stroke="#10b981" stroke-width="1.5"/>
  <text x="355" y="250" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">AES Decrypt</text>
  <text x="355" y="265" text-anchor="middle" font-size="9" fill="#059669">verify HMAC tag</text>
  <text x="355" y="277" text-anchor="middle" font-size="8" fill="#34d399">reject tampered</text>

  <line x1="288" y1="259" x2="260" y2="259" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-r)"/>

  <!-- Codec2 Decode -->
  <rect x="150" y="231" width="110" height="56" rx="8" fill="#8b5cf6" opacity="0.12" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="205" y="253" text-anchor="middle" font-size="11" font-weight="600" fill="#6d28d9">Codec2</text>
  <text x="205" y="268" text-anchor="middle" font-size="9" fill="#7c3aed">decode speech</text>

  <line x1="148" y1="259" x2="120" y2="259" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-r)"/>

  <!-- Voice Output -->
  <rect x="20" y="231" width="100" height="56" rx="8" fill="#f97316" opacity="0.12" stroke="#f97316" stroke-width="1.5"/>
  <text x="70" y="256" text-anchor="middle" font-size="12" font-weight="600" fill="#c2410c">Voice</text>
  <text x="70" y="272" text-anchor="middle" font-size="9" fill="#9a3412">reconstructed</text>

  <!-- Bit rate annotations -->
  <text x="135" y="145" text-anchor="middle" font-size="8" fill="#94a3b8" font-style="italic">8000 Hz</text>
  <text x="275" y="145" text-anchor="middle" font-size="8" fill="#94a3b8" font-style="italic">1200 bps</text>
  <text x="435" y="145" text-anchor="middle" font-size="8" fill="#94a3b8" font-style="italic">+24 bits</text>
  <text x="585" y="145" text-anchor="middle" font-size="8" fill="#94a3b8" font-style="italic">+parity</text>
  <text x="735" y="145" text-anchor="middle" font-size="8" fill="#94a3b8" font-style="italic">audio</text>

  <!-- Legend -->
  <rect x="20" y="305" width="10" height="10" rx="2" fill="#f97316" opacity="0.3"/>
  <text x="35" y="314" font-size="9" fill="#64748b">Audio</text>
  <rect x="80" y="305" width="10" height="10" rx="2" fill="#8b5cf6" opacity="0.3"/>
  <text x="95" y="314" font-size="9" fill="#64748b">Vocoder</text>
  <rect x="155" y="305" width="10" height="10" rx="2" fill="#10b981" opacity="0.3"/>
  <text x="170" y="314" font-size="9" fill="#64748b">Crypto</text>
  <rect x="220" y="305" width="10" height="10" rx="2" fill="#3b82f6" opacity="0.3"/>
  <text x="235" y="314" font-size="9" fill="#64748b">FEC</text>
  <rect x="265" y="305" width="10" height="10" rx="2" fill="#06b6d4" opacity="0.3"/>
  <text x="280" y="314" font-size="9" fill="#64748b">Modem</text>
  <rect x="325" y="305" width="10" height="10" rx="2" fill="#ef4444" opacity="0.2"/>
  <text x="340" y="314" font-size="9" fill="#64748b">Phone Network</text>
</svg>
