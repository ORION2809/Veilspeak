<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <rect width="860" height="280" rx="12" fill="url(#bg2)" stroke="#e2e8f0" stroke-width="1"/>

  <text x="430" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a" letter-spacing="0.5">SUPERFRAME STRUCTURE</text>
  <text x="430" y="48" text-anchor="middle" font-size="11" fill="#64748b">480 ms = 3840 samples at 8 kHz &mdash; one complete transmission unit</text>

  <!-- Main timeline bar -->
  <!-- Pause: 80ms = 640 samples -->
  <rect x="40" y="80" width="133" height="60" rx="6" fill="#94a3b8" opacity="0.2" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="106" y="107" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">Pause</text>
  <text x="106" y="124" text-anchor="middle" font-size="10" fill="#64748b">80 ms</text>

  <!-- Header 1: pilot -->
  <rect x="177" y="80" width="35" height="60" rx="6" fill="#8b5cf6" opacity="0.25" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="194" y="137" font-size="8" fill="#6d28d9" text-anchor="middle" transform="rotate(-90 194 115)">Pilot</text>

  <!-- Header 2: type -->
  <rect x="216" y="80" width="35" height="60" rx="6" fill="#a78bfa" opacity="0.25" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="233" y="137" font-size="8" fill="#6d28d9" text-anchor="middle" transform="rotate(-90 233 115)">Type</text>

  <!-- Data symbols: 38 symbols -->
  <rect x="255" y="80" width="565" height="60" rx="6" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Show individual symbol divisions (every ~15px for 38 symbols) -->
  <g opacity="0.3">
    <line x1="270" y1="85" x2="270" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="285" y1="85" x2="285" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="300" y1="85" x2="300" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="315" y1="85" x2="315" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="330" y1="85" x2="330" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="345" y1="85" x2="345" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="360" y1="85" x2="360" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="375" y1="85" x2="375" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="390" y1="85" x2="390" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="405" y1="85" x2="405" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="420" y1="85" x2="420" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="435" y1="85" x2="435" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="450" y1="85" x2="450" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="465" y1="85" x2="465" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="480" y1="85" x2="480" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="495" y1="85" x2="495" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="510" y1="85" x2="510" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="525" y1="85" x2="525" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="540" y1="85" x2="540" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="555" y1="85" x2="555" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="570" y1="85" x2="570" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="585" y1="85" x2="585" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="600" y1="85" x2="600" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="615" y1="85" x2="615" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="630" y1="85" x2="630" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="645" y1="85" x2="645" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="660" y1="85" x2="660" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="675" y1="85" x2="675" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="690" y1="85" x2="690" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="705" y1="85" x2="705" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="720" y1="85" x2="720" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="735" y1="85" x2="735" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="750" y1="85" x2="750" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="765" y1="85" x2="765" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="780" y1="85" x2="780" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="795" y1="85" x2="795" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="805" y1="85" x2="805" y2="135" stroke="#3b82f6" stroke-width="0.5"/>
  </g>

  <text x="537" y="107" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">38 Data Symbols</text>
  <text x="537" y="124" text-anchor="middle" font-size="10" fill="#3b82f6">380 ms &mdash; encrypted speech + FEC parity</text>

  <!-- Time axis -->
  <line x1="40" y1="155" x2="820" y2="155" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="40" y1="150" x2="40" y2="160" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="40" y="172" text-anchor="middle" font-size="9" fill="#64748b">0 ms</text>
  <line x1="173" y1="150" x2="173" y2="160" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="173" y="172" text-anchor="middle" font-size="9" fill="#64748b">80</text>
  <line x1="213" y1="150" x2="213" y2="160" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="213" y="172" text-anchor="middle" font-size="9" fill="#64748b">100</text>
  <line x1="820" y1="150" x2="820" y2="160" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="820" y="172" text-anchor="middle" font-size="9" fill="#64748b">480 ms</text>

  <!-- Explanation boxes -->
  <rect x="40" y="195" width="175" height="70" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="127" y="215" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Why the Pause?</text>
  <text x="127" y="230" text-anchor="middle" font-size="9" fill="#64748b">Phone codecs mute steady</text>
  <text x="127" y="243" text-anchor="middle" font-size="9" fill="#64748b">signals. The 80 ms gap keeps</text>
  <text x="127" y="256" text-anchor="middle" font-size="9" fill="#64748b">the codec treating it as speech.</text>

  <rect x="235" y="195" width="175" height="70" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="322" y="215" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Each Symbol</text>
  <text x="322" y="230" text-anchor="middle" font-size="9" fill="#64748b">10 ms long, 23 tones in</text>
  <text x="322" y="243" text-anchor="middle" font-size="9" fill="#64748b">4-PSK. Up to 24 bits per</text>
  <text x="322" y="256" text-anchor="middle" font-size="9" fill="#64748b">symbol in FAST mode.</text>

  <rect x="430" y="195" width="175" height="70" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="517" y="215" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Data Capacity</text>
  <text x="517" y="230" text-anchor="middle" font-size="9" fill="#64748b">FAST: 2 FEC frames = 480 ms</text>
  <text x="517" y="243" text-anchor="middle" font-size="9" fill="#64748b">of Codec2 1200 speech.</text>
  <text x="517" y="256" text-anchor="middle" font-size="9" fill="#64748b">ROBUST: 1 frame at 700 bps.</text>

  <rect x="625" y="195" width="195" height="70" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="722" y="215" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Header Symbols</text>
  <text x="722" y="230" text-anchor="middle" font-size="9" fill="#64748b">Pilot: known phases for</text>
  <text x="722" y="243" text-anchor="middle" font-size="9" fill="#64748b">channel estimation. Type:</text>
  <text x="722" y="256" text-anchor="middle" font-size="9" fill="#64748b">identifies FAST/ROBUST/etc.</text>
</svg>
